spring:
  application:
    name: tech-events-map-backend

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:techevents}
    username: ${DB_USER:techevents}
    password: ${DB_PASSWORD:techevents}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2

  flyway:
    enabled: true
    locations: classpath:db/migration

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        format_sql: false
    show-sql: false

  jackson:
    serialization:
      write-dates-as-timestamps: false
    time-zone: UTC

  data:
    web:
      pageable:
        default-page-size: 20
        max-page-size: 100
        page-parameter: page
        size-parameter: size
        sort-parameter: sort

server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: always
    include-binding-errors: always

management:
  endpoints:
    web:
      base-path: /actuator
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

# CORS: set APP_CORS_ALLOWED_ORIGIN to your frontend URL (e.g. https://app.example.com)
app:
  cors:
    allowed-origin: ${APP_CORS_ALLOWED_ORIGIN:http://localhost:5173}
  events:
    featured:
      # Max rows for GET /events/featured (nearest upcoming first). Override e.g. APP_EVENTS_FEATURED_LIMIT=15
      limit: ${APP_EVENTS_FEATURED_LIMIT:10}

logging:
  level:
    root: INFO
    org.hibernate.SQL: WARN
